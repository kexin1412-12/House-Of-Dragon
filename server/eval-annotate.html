\\n阿拉克斯的弱小不是抽象的‘幼龙意象’，而是路斯里斯政治处境的视觉化：他带着使者身份离开，却面对一个远超外交尺度的战争机器。\\n这幅画紧跟分裂家\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:daenys_dream_and_doom_of_valyria:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这是坦格利安王朝真正的‘基因原点’：家族并非从征服开始，而是从一次对毁灭的预见和逃亡开始。第一场梦让他们从火海中幸存，也让‘梦’从此成为家族理解自身使命的语言。片头把预言者、巨龙与流血并置，强调坦格利安最珍贵的天赋始终带着双刃性——他们能比别人更早看见灾难，却未必能正确解释梦，更未必能控制梦被权力使用后的后果。\\n这幅画不按现实空间摆放人物，而像把梦的碎片同时缝在一块布上：惊惧的人、带血的火焰与巨龙彼此侵入。红线在这里既像预言书写下的警告，也像尚未发生却已渗进画面的灾难。片头由此把坦格利安历史的第一步定义为‘提前看见火’，并为后面所有关于梦、继承和龙火失控的故事定下宿命基调。\\n黛妮丝的梦救下家族，后来坦格利安统治者也不断把梦与预言当作政治责任的一部分；两者构成‘预言既能救国，也能成为沉重负担’的历史反差。\\n不能把韦赛里斯迎娶阿莉森直接归因于预言；更准确的关联是，他把王朝使命与征服者之梦交给继\"}]},{\"id\":\"r014\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":2084,\"knowledge_type\":\"character_relationship\",\"query\":\"阿莉森特·海塔尔和艾蒙德·坦格利安现在是什么关系？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:23:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"母子 / 权力恐惧 — 阿莉森特面对伊蒙德时混杂亲情、恐惧、厌恶与政治判断。\"},{\"id\":\"house-of-the-dragon:rel:2:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"关系疏远 — 因身份与立场变化关系出现裂痕。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"宫廷侍女 / 王之手之女 / 海塔尔家族在朝中的延伸；与雷尼拉自幼相识 / 御前首相奥托之女，与雷尼拉公主同龄、关系亲密。\"},{\"id\":\"house-of-the-dragon:char:aemond_targaryen:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"王子 / 韦赛里斯与阿莉森特的次子；自小被嘲未驯龙，性格冷峻 / 阿莉森特次子，性格内敛冷峻，与兄姐不同极有抱负。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"把海塔尔家族重新推回权力轴线；替被革职的父亲奥托做政治反弹 — s454 deep_reading：女儿用一袭绿衣替父亲把宣战书递回到国王面前。\"},{\"id\":\"house-of-the-dragon:recap:21\",\"knowledge_type\":\"external_knowledge\",\"content\":\"龙的象征与家族命运 — 韦赛里斯通过龙的头骨暗示坦格利安家族的脆弱，预示未来的危机。 — 龙象征家族的脆弱与危机。\"},{\"id\":\"house-of-the-dragon:recap:17\",\"knowledge_type\":\"external_knowledge\",\"content\":\"奥托的操控 — 奥托通过安排艾莉森安慰韦赛里斯，展现了他在权力游戏中的操控能力。 — 奥托的权力操控手法。\"}]},{\"id\":\"r015\",\"videoId\":\"house_of_dragon_05\",\"curso 片头用这份修复与当前家族撕裂形成反差，以祖先艰难建立的和平反衬后代争夺王座的代价。\\n他们的治世并没有消除继承制度中的性别与合法性矛盾，长期和平之下仍留下后来争端会重新触\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:vhagar_kills_arrax:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这不是普通的龙战回顾，而是继承争议转化为血亲复仇与全面战争的临界点。上一幅仍是两个朝廷、两套法理的对峙；到了这里，政治问题被巨龙的本能和压倒性体型差直接撕碎。更深一层是‘驭龙者未必能驾驭龙’：坦格利安把巨龙当作血统合法性的证明和威慑工具，可真正开战时，这些拥有意志的古老武器会把人的恐吓升级成无法撤回的死亡。\\n圆形构图像一个无法逃出的猎场，瓦格哈尔的深色身体几乎覆盖上方空间，阿拉克斯则被压缩成边缘的小块浅色。挂毯把剧中关于失控、误判和恐惧的复杂过程压缩成‘大龙吞小龙’的历史图标，正好体现后世记忆如何牺牲动机细节，只留下改变战争走向的结果。\\n瓦格哈尔曾属于建立和守护王朝的前代骑手，如今却杀死同族少年的龙；同一份祖先遗产从王朝资本转化为家族内战的毁灭能力。\\n阿拉克斯的弱小不是抽象的‘幼龙意象’，而是路斯里斯政治处境的视觉化：他带着使者身份离开，却面对一个远超外交尺度的战争机器。\\n这幅画紧跟分裂家\"},{\"id\":\"house-of-the-dragon:recap:18\",\"knowledge_type\":\"external_knowledge\",\"content\":\"韦赛里斯的软弱与戴蒙的直言 — 戴蒙直言揭露韦赛里斯的软弱，反映出权力斗争中的真实动机与内心挣扎。 — 权力斗争中的真实动机。\"}]},{\"id\":\"r024\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":1802,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，奥托·海塔尔在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:4:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父女 — 阿莉森特是奥托·海塔尔的女儿。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"把海塔尔家族重新推回权力轴线；替被革职的父亲奥托做政治反弹 — s454 deep_reading：女儿用一袭绿衣替父亲把宣战书递回到国王面前。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"海塔尔家族战旗持有者（仍为王后） / 公开宣告归入海塔尔家族一侧；'绿党'诞生时刻的当事人 / 在雷妮拉婚宴上身穿海塔尔祖母绿独自迟到入场——告别韦赛里斯—雷妮拉父女轴线。\"},{\"id\":\"house-of-the-dragon:rel:20:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"政治盟友 — 克里斯顿黑化完成后转向海塔尔一侧——他对绿党的忠诚从这摊血开始计算。 — s661 deep_reading：克里斯顿本人也在这一帧黑化完成，后续他对绿党的忠诚都是从这摊血开始计算的。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"宫廷侍女 / 王之手之女 / 海塔尔家族在朝中的延伸；与雷尼拉自幼相识 / 御前首相奥托之女，与雷尼拉公主同龄、关系亲密。\"},{\"id\":\"house-of-the-dragon:recap:17\",\"knowledge_type\":\"external_knowledge\",\"content\":\"奥托的操控 — 奥托通过安排艾莉森安慰韦赛里斯，展现了他在权力游戏中的操控能力。 — 奥托的权力操控手法。\"},{\"id\":\"house-of-the-dragon:recap:4\",\"knowledge_type\":\"external_knowledge\",\"content\":\"艾玛的角色与情感冲突 — 艾玛的教导与她自身的经历形成对比，暗示她对传统角色的无奈与未来的悲剧。 — 艾玛的教导暗示未来悲剧。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:2\",\"knowledge_type\":\"character_motivation\",\"content\":\"戴蒙的耳语在公开仪式内部撕开私人裂口；雷妮拉默认接受'戴蒙永远在场'的事实 — s509 deep_reading：真正改变雷妮拉轨迹的不是戴蒙说的内容，而是戴蒙能在这个场合说这种话本身——她在那一刻接受了'戴蒙永远在场'。\"}]},{\"id\":\"r025\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":1574,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，雷尼拉·坦格利安在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:19:2\",\"knowledge_type\":\"character_relationship\",\"content\":\"敌对 — 雷妮拉拒绝私奔后克里斯顿在婚宴当众杀人——他与雷妮拉的私人忠诚关系在这一帧彻底反转。 — s661 deep_reading：克里斯顿在前段（雷妮拉拒绝与他私奔）+ s509 戴蒙耳语 + s454 阿莉森特绿衣登场……三重压力下，选择把私人羞愤投射到乔弗里身上。\"},{\"id\":\"house-of-the-dragon:rel:44:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"暧昧 — 戴蒙在婚宴舞池贴近雷妮拉耳边低语——在最公开的场合制造最私密的接触，雷妮拉接受了'戴蒙永远在场'。 — s509 deep_reading：在所有人能看到的地方说所有人都听不到的话……她在那一刻接受了'戴蒙永远在场'。\"},{\"id\":\"house-of-the-dragon:recap:14\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的丧母之痛 — 雷尼拉在丧礼上的表现揭示了她对母亲的深切怀念和对家庭的失落感。 — 雷尼拉的痛苦揭示角色深度。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"龙石岛公主，铁王座继承人，莱诺·瓦列利安之妻 / 通过血泊婚礼与瓦列利安家族绑定；其婚事开局即被血涂改 / 在血泊残局中与莱诺·瓦列利安完成割手交血礼，婚事完成但其象征意义已坍塌。\"},{\"id\":\"house-of-the-dragon:recap:6\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的内心矛盾 — 雷尼拉希望母亲生下男孩，以便她能获得更多自由，这反映了她对权力中心的渴望与无奈。 — 雷尼拉渴望自由与权力的矛盾。\"},{\"id\":\"house-of-the-dragon:char:criston_cole:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"对雷妮拉的私人忠诚转向私愤投射；为后续投靠绿党铺设动机 — s661 deep_reading：克里斯顿对绿党的忠诚都是从这摊血开始计算的。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:2\",\"knowledge_type\":\"character_motivation\",\"content\":\"戴蒙的耳语在公开仪式内部撕开私人裂口；雷妮拉默认接受'戴蒙永远在场'的事实 — s509 deep_reading：真正改变雷妮拉轨迹的不是戴蒙说的内容，而是戴蒙能在这个场合说这种话本身——她在那一刻接受了'戴蒙永远在场'。\"},{\"id\":\"house-of-the-dragon:char:criston_cole:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"御林铁卫骑士 / 御林铁卫；与雷尼拉公主关系破裂 / 出身寒微的杰出比武骑士，被雷尼拉钦点入御林铁卫。\"}]},{\"id\":\"r026\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":2257,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，亚莉·河文在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:char:alys_rivers:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"女巫般的河间地女人 / 以预言和警告影响战局边缘人物 / S03E01 中突然出现在佣兵面前，警告他们已经错过战争。\"},{\"id\":\"house-of-the-dragon:rel:60:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"神秘牵引 — 亚莉·河文的出现与警告让绿党和龙骑行动带上神秘色彩。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:jaehaerys_and_alysanne_restoration:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"构图故意让两人并肩，而不是让王后退到背景：它把新统治的合法性表现为合作、调停与王朝延续。更关键的是与上一幅的剪辑关系——梅葛独自被王座刺穿，杰赫里斯与亚莉珊则成对出现；一个靠恐惧把所有人推远，一个靠联盟与共同治理恢复秩序。杰赫里斯时期对教会的和解、‘例外论’及长期制度建设，说明坦格利安王权不只靠龙与宝剑，也靠把异端血统重新包装成可被王国接受的秩序。\\n梅葛的孤死与这对夫妇的并肩由连续剪辑直接相接：上一幅把权力拍成吞噬人的刑具，这一幅则把权力拍成需要共同维系的制度。以精美、近乎神圣的黄金挂毯承载这段盛世，也让观众意识到正片人物终有一天会像他们一样，被后世压缩成几种姿态和几根丝线。\\n杰赫里斯与亚莉珊的长期统治常被视为王朝黄金时代；片头用这份修复与当前家族撕裂形成反差，以祖先艰难建立的和平反衬后代争夺王座的代价。\\n他们的治世并没有消除继承制度中的性别与合法性矛盾，长期和平之下仍留下后来争端会重新触\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:prince_jaehaerys_funeral:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"真正的核心不是‘产房悲剧切断继承线’，而是复仇如何从战场外侵入儿童卧室：上一幅的死者是黑党少年，这一幅立即换成绿党幼子，红线因此不再只是抽象血脉，而成为一条双方都能继续拉扯的血债。杰赫里斯既是无辜受害者，也被绿党葬礼重新包装成争取民意的政治符号。挂毯把柔软花环、白布和横断颈部的血线并置，让王室最体面的仪式无法遮住权力斗争对孩子身体的直接伤害。\\n构图先用白布、花叶和蜡烛制造近乎圣像的安静，再用横穿颈部的红线破坏安宁。那条线既像绣线、血痕，也像被暴力截断的血脉，把挂毯媒介本身变成伤口。它不是艾玛产房惨剧的复述，而是第二季新加入的历史补丁：昨天发生的谋杀，今天已经被织成阵营记忆。\\n片头把路斯里斯之死与杰赫里斯之死首尾相接，视觉化戴蒙口中的‘儿子偿还儿子’，也显示报复并没有恢复平衡，只是制造下一轮血债。\\n蜡烛可被读作生命与王朝希望：火焰明灭强化儿童死亡的哀悼感，但不能把每一根蜡烛机械对应到某个具体\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:vhagar_kills_arrax:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这不是普通的龙战回顾，而是继承争议转化为血亲复仇与全面战争的临界点。上一幅仍是两个朝廷、两套法理的对峙；到了这里，政治问题被巨龙的本能和压倒性体型差直接撕碎。更深一层是‘驭龙者未必能驾驭龙’：坦格利安把巨龙当作血统合法性的证明和威慑工具，可真正开战时，这些拥有意志的古老武器会把人的恐吓升级成无法撤回的死亡。\\n圆形构图像一个无法逃出的猎场，瓦格哈尔的深色身体几乎覆盖上方空间，阿拉克斯则被压缩成边缘的小块浅色。挂毯把剧中关于失控、误判和恐惧的复杂过程压缩成‘大龙吞小龙’的历史图标，正好体现后世记忆如何牺牲动机细节，只留下改变战争走向的结果。\\n瓦格哈尔曾属于建立和守护王朝的前代骑手，如今却杀死同族少年的龙；同一份祖先遗产从王朝资本转化为家族内战的毁灭能力。\\n阿拉克斯的弱小不是抽象的‘幼龙意象’，而是路斯里斯政治处境的视觉化：他带着使者身份离开，却面对一个远超外交尺度的战争机器。\\n这幅画紧跟分裂家\"},{\"id\":\"house-of-the-dragon:rel:19:2\",\"knowledge_type\":\"character_relationship\",\"content\":\"敌对 — 雷妮拉拒绝私奔后克里斯顿在婚宴当众杀人——他与雷妮拉的私人忠诚关系在这一帧彻底反转。 — s661 deep_reading：克里斯顿在前段（雷妮拉拒绝与他私奔）+ s509 戴蒙耳语 + s454 阿莉森特绿衣登场……三重压力下，选择把私人羞愤投射到乔弗里身上。\"},{\"id\":\"house-of-the-dragon:recap:4\",\"knowledge_type\":\"external_knowledge\",\"content\":\"艾玛的角色与情感冲突 — 艾玛的教导与她自身的经历形成对比，暗示她对传统角色的无奈与未来的悲剧。 — 艾玛的教导暗示未来悲剧。\"},{\"id\":\"house-of-the-dragon:char:helaena_targaryen:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"王后 / 绿党宫廷中的象征性人物，常以预感和疏离感回应局势 / S03E01 中处于绿党宫廷线，与阿莉森特共同承受战争阴影。\"}]},{\"id\":\"r027\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":2025,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，莱昂诺·斯壮在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:char:larys_strong:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"斯壮家次子 / 御前首相莱昂诺的次子 / 莱昂诺·斯壮的次子，瘸腿，沉默寡言，善于经营暗中关系。\"},{\"id\":\"house-of-the-dragon:rel:14:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父子 — 拉里斯是河铭城公爵的次子。\"},{\"id\":\"house-of-the-dragon:char:lyonel_strong:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"司法大臣 / 赫伦堡领主；以法律和理性顾问国王 / 赫伦堡的莱昂诺·斯壮公爵，以学识与公正见长，曾任国王法律顾问。\"},{\"id\":\"house-of-the-dragon:rel:13:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父子 — 哈尔温是河铭城公爵 Lyonel 的长子与继承人。\"},{\"id\":\"house-of-the-dragon:recap:16\",\"knowledge_type\":\"external_knowledge\",\"content\":\"韦赛里斯的逃避 — 韦赛里斯在选择中表现出逃避态度，显示出他内心的矛盾和无力感。 — 韦赛里斯的内心挣扎。\"},{\"id\":\"house-of-the-dragon:recap:18\",\"knowledge_type\":\"external_knowledge\",\"content\":\"韦赛里斯的软弱与戴蒙的直言 — 戴蒙直言揭露韦赛里斯的软弱，反映出权力斗争中的真实动机与内心挣扎。 — 权力斗争中的真实动机。\"},{\"id\":\"house-of-the-dragon:char:criston_cole:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"对雷妮拉的私人忠诚转向私愤投射；为后续投靠绿党铺设动机 — s661 deep_reading：克里斯顿对绿党的忠诚都是从这摊血开始计算的。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:2\",\"knowledge_type\":\"character_motivation\",\"content\":\"戴蒙的耳语在公开仪式内部撕开私人裂口；雷妮拉默认接受'戴蒙永远在场'的事实 — s509 deep_reading：真正改变雷妮拉轨迹的不是戴蒙说的内容，而是戴蒙能在这个场合说这种话本身——她在那一刻接受了'戴蒙永远在场'。\"}]},{\"id\":\"r028\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":903,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，韦赛里斯一世·坦格利安在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:8:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"表亲冷淡 — 蕾妮丝在潮头岛迎接仪式上对韦赛里斯施以'不全礼'——海蛇家族用礼节表达不满，蕾妮丝的注视则是冷审视。 — s123 deep_reading：婚事谈得再漂亮，这家人不会真的承认你这一支的优越性。\"},{\"id\":\"house-of-the-dragon:rel:3:2\",\"knowledge_type\":\"character_relationship\",\"content\":\"夫妻对立 — 在雷妮拉婚宴上身穿海塔尔祖母绿独自迟到——王后用最公开的仪式当众告别国王轴线。 — s454 deep_reading：阿莉森特此前一直依附韦赛里斯—雷妮拉的'国王—继承人'轴线……今晚她决意用最公开的仪式当众告别这个轴线。\"},{\"id\":\"house-of-the-dragon:char:viserys_targaryen:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"七大王国之王 / 王朝维系者，介于平衡各家族之间 / 坦格利安王朝第五任国王，老国王杰赫里斯指定的继承人，被期待维系王朝百年和平。\"},{\"id\":\"house-of-the-dragon:recap:21\",\"knowledge_type\":\"external_knowledge\",\"content\":\"龙的象征与家族命运 — 韦赛里斯通过龙的头骨暗示坦格利安家族的脆弱，预示未来的危机。 — 龙象征家族的脆弱与危机。\"},{\"id\":\"house-of-the-dragon:char:aegon_targaryen_ii:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"王子 / 韦赛里斯与阿莉森特的长子；母系希望他成为继承人 / 韦赛里斯与阿莉森特之长子，年少放荡，对继承王位无兴趣。\"},{\"id\":\"house-of-the-dragon:recap:16\",\"knowledge_type\":\"external_knowledge\",\"content\":\"韦赛里斯的逃避 — 韦赛里斯在选择中表现出逃避态度，显示出他内心的矛盾和无力感。 — 韦赛里斯的内心挣扎。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"把海塔尔家族重新推回权力轴线；替被革职的父亲奥托做政治反弹 — s454 deep_reading：女儿用一袭绿衣替父亲把宣战书递回到国王面前。\"},{\"id\":\"house-of-the-dragon:char:criston_cole:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"对雷妮拉的私人忠诚转向私愤投射；为后续投靠绿党铺设动机 — s661 deep_reading：克里斯顿对绿党的忠诚都是从这摊血开始计算的。\"}]},{\"id\":\"r029\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":3158,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，海拉娜·坦格利安在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:8:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"表亲冷淡 — 蕾妮丝在潮头岛迎接仪式上对韦赛里斯施以'不全礼'——海蛇家族用礼节表达不满，蕾妮丝的注视则是冷审视。 — s123 deep_reading：婚事谈得再漂亮，这家人不会真的承认你这一支的优越性。\"},{\"id\":\"house-of-the-dragon:rel:43:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"公开对立 — 绿衣登场是阿莉森特把对雷妮拉父女轴线的告别公开化的瞬间——闺蜜→疏离→当众宣战。 — s454 deep_reading：色码、迟到、独行，三个仪式层面的动作叠加……'绿党'诞生的视觉签字时刻。\"},{\"id\":\"house-of-the-dragon:char:rhea_royce:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"已故符文谷夫人 / S01E05 冷开场被戴蒙以伪装坠马的方式杀害；蒙太奇拍法让暴行被遮蔽但已成既成事实。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"龙石岛公主，铁王座继承人，莱诺·瓦列利安之妻 / 通过血泊婚礼与瓦列利安家族绑定；其婚事开局即被血涂改 / 在血泊残局中与莱诺·瓦列利安完成割手交血礼，婚事完成但其象征意义已坍塌。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:2\",\"knowledge_type\":\"character_motivation\",\"content\":\"戴蒙的耳语在公开仪式内部撕开私人裂口；雷妮拉默认接受'戴蒙永远在场'的事实 — s509 deep_reading：真正改变雷妮拉轨迹的不是戴蒙说的内容，而是戴蒙能在这个场合说这种话本身——她在那一刻接受了'戴蒙永远在场'。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"认清自己在父亲眼中已是'要被止损的丑闻'，不再为政治婚姻保留浪漫幻想，准备以清醒交易心态进入婚姻 — s146 deep_reading：她已经知道在父亲眼里自己就是'要被止损的丑闻'，她没有理由再为一段政治婚姻保留浪漫幻想。\"},{\"id\":\"house-of-the-dragon:recap:4\",\"knowledge_type\":\"external_knowledge\",\"content\":\"艾玛的角色与情感冲突 — 艾玛的教导与她自身的经历形成对比，暗示她对传统角色的无奈与未来的悲剧。 — 艾玛的教导暗示未来悲剧。\"},{\"id\":\"house-of-the-dragon:recap:14\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的丧母之痛 — 雷尼拉在丧礼上的表现揭示了她对母亲的深切怀念和对家庭的失落感。 — 雷尼拉的痛苦揭示角色深度。\"}]},{\"id\":\"r030\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":3035,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，科利斯·瓦列利安在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:char:corlys_velaryon:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"潮汐之主，黑党海军统帅 / 以瓦列利安舰队支撑雷妮拉阵营，喉道海战核心人物 / S03E01 中指挥舰队进入喉道并遭遇伏击。\"},{\"id\":\"house-of-the-dragon:char:alyn_of_hull:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"水手 / 科利斯舰队中的成员，与科利斯存在更深的家族线索 / 在 S03E01 与科利斯共饮并交谈，处在瓦列利安舰队叙事线中。\"},{\"id\":\"house-of-the-dragon:rel:55:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"舰队上下级 — 亚林与科利斯共处瓦列利安舰队线，关系里带有未明说的家族张力。\"},{\"id\":\"house-of-the-dragon:rel:36:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"龙骑士 — 原本是科利斯之子劳琳诺的龙，剧中没有直接登场太多——这里以瓦列利安家族关联呈现。\"},{\"id\":\"house_of_dragon_s03e01:scene:s059:lohar_follows_sea_snake_into_narrows:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这个人物特写把抽象的追兵变成了洛哈尔的个人选择：她明知正在进入海蛇熟悉、自己陌生的水域，仍因追杀科利斯的执念继续压上。镜头因此不是单纯展示航线，而是在交代她如何主动走进科利斯布置的地形陷阱。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:daenys_dream_and_doom_of_valyria:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这是坦格利安王朝真正的‘基因原点’：家族并非从征服开始，而是从一次对毁灭的预见和逃亡开始。第一场梦让他们从火海中幸存，也让‘梦’从此成为家族理解自身使命的语言。片头把预言者、巨龙与流血并置，强调坦格利安最珍贵的天赋始终带着双刃性——他们能比别人更早看见灾难，却未必能正确解释梦，更未必能控制梦被权力使用后的后果。\\n这幅画不按现实空间摆放人物，而像把梦的碎片同时缝在一块布上：惊惧的人、带血的火焰与巨龙彼此侵入。红线在这里既像预言书写下的警告，也像尚未发生却已渗进画面的灾难。片头由此把坦格利安历史的第一步定义为‘提前看见火’，并为后面所有关于梦、继承和龙火失控的故事定下宿命基调。\\n黛妮丝的梦救下家族，后来坦格利安统治者也不断把梦与预言当作政治责任的一部分；两者构成‘预言既能救国，也能成为沉重负担’的历史反差。\\n不能把韦赛里斯迎娶阿莉森直接归因于预言；更准确的关联是，他把王朝使命与征服者之梦交给继\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:vhagar_kills_arrax:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这不是普通的龙战回顾，而是继承争议转化为血亲复仇与全面战争的临界点。上一幅仍是两个朝廷、两套法理的对峙；到了这里，政治问题被巨龙的本能和压倒性体型差直接撕碎。更深一层是‘驭龙者未必能驾驭龙’：坦格利安把巨龙当作血统合法性的证明和威慑工具，可真正开战时，这些拥有意志的古老武器会把人的恐吓升级成无法撤回的死亡。\\n圆形构图像一个无法逃出的猎场，瓦格哈尔的深色身体几乎覆盖上方空间，阿拉克斯则被压缩成边缘的小块浅色。挂毯把剧中关于失控、误判和恐惧的复杂过程压缩成‘大龙吞小龙’的历史图标，正好体现后世记忆如何牺牲动机细节，只留下改变战争走向的结果。\\n瓦格哈尔曾属于建立和守护王朝的前代骑手，如今却杀死同族少年的龙；同一份祖先遗产从王朝资本转化为家族内战的毁灭能力。\\n阿拉克斯的弱小不是抽象的‘幼龙意象’，而是路斯里斯政治处境的视觉化：他带着使者身份离开，却面对一个远超外交尺度的战争机器。\\n这幅画紧跟分裂家\"},{\"id\":\"house-of-the-dragon:recap:23\",\"knowledge_type\":\"external_knowledge\",\"content\":\"紧张感的营造 — 平行剪辑在继承仪式与韦赛里斯的对话中增强了紧张感，暗示权力的争夺。 — 平行剪辑增强了紧张感。\"}]},{\"id\":\"r031\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":2747,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，雷尼拉·坦格利安在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:19:2\",\"knowledge_type\":\"character_relationship\",\"content\":\"敌对 — 雷妮拉拒绝私奔后克里斯顿在婚宴当众杀人——他与雷妮拉的私人忠诚关系在这一帧彻底反转。 — s661 deep_reading：克里斯顿在前段（雷妮拉拒绝与他私奔）+ s509 戴蒙耳语 + s454 阿莉森特绿衣登场……三重压力下，选择把私人羞愤投射到乔弗里身上。\"},{\"id\":\"house-of-the-dragon:rel:44:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"暧昧 — 戴蒙在婚宴舞池贴近雷妮拉耳边低语——在最公开的场合制造最私密的接触，雷妮拉接受了'戴蒙永远在场'。 — s509 deep_reading：在所有人能看到的地方说所有人都听不到的话……她在那一刻接受了'戴蒙永远在场'。\"},{\"id\":\"house-of-the-dragon:recap:6\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的内心矛盾 — 雷尼拉希望母亲生下男孩，以便她能获得更多自由，这反映了她对权力中心的渴望与无奈。 — 雷尼拉渴望自由与权力的矛盾。\"},{\"id\":\"house-of-the-dragon:recap:3\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机与母亲的教导 — 雷尼拉渴望成为龙骑士，与母亲的传统角色期待形成对比，反映出她的叛逆与追求。 — 雷尼拉渴望打破传统角色。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"龙石岛公主，铁王座继承人，莱诺·瓦列利安之妻 / 通过血泊婚礼与瓦列利安家族绑定；其婚事开局即被血涂改 / 在血泊残局中与莱诺·瓦列利安完成割手交血礼，婚事完成但其象征意义已坍塌。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:daenys_dream_and_doom_of_valyria:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这是坦格利安王朝真正的‘基因原点’：家族并非从征服开始，而是从一次对毁灭的预见和逃亡开始。第一场梦让他们从火海中幸存，也让‘梦’从此成为家族理解自身使命的语言。片头把预言者、巨龙与流血并置，强调坦格利安最珍贵的天赋始终带着双刃性——他们能比别人更早看见灾难，却未必能正确解释梦，更未必能控制梦被权力使用后的后果。\\n这幅画不按现实空间摆放人物，而像把梦的碎片同时缝在一块布上：惊惧的人、带血的火焰与巨龙彼此侵入。红线在这里既像预言书写下的警告，也像尚未发生却已渗进画面的灾难。片头由此把坦格利安历史的第一步定义为‘提前看见火’，并为后面所有关于梦、继承和龙火失控的故事定下宿命基调。\\n黛妮丝的梦救下家族，后来坦格利安统治者也不断把梦与预言当作政治责任的一部分；两者构成‘预言既能救国，也能成为沉重负担’的历史反差。\\n不能把韦赛里斯迎娶阿莉森直接归因于预言；更准确的关联是，他把王朝使命与征服者之梦交给继\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"公主 / 国王韦赛里斯的独女，并未被视为继承人 / 韦赛里斯之女，钟爱骑龙，对宫廷礼制感到束缚。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"认清自己在父亲眼中已是'要被止损的丑闻'，不再为政治婚姻保留浪漫幻想，准备以清醒交易心态进入婚姻 — s146 deep_reading：她已经知道在父亲眼里自己就是'要被止损的丑闻'，她没有理由再为一段政治婚姻保留浪漫幻想。\"}]},{\"id\":\"r032\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":1265,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，乌尔夫·怀特在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house_of_dragon_s03e01:scene:s002:maegor_dead_on_iron_throne:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"画面的核心不是泛泛的‘王权伴随流血’，而是权力反噬暴君：梅葛靠篡位、恐怖与弑亲维持的统治，最终让象征统治权的铁王座变成了他的刑具。两侧的沃米索尔与银翼则把死亡画面变成一次政权交接——孤立的暴君退场，杰赫里斯与亚莉珊代表的修复性统治即将开始。\\n中央尸体、两侧巨龙和向下渗开的红线把死亡做成王朝转场：梅葛的身体既是暴政终点，也是下一段历史的接缝。挂毯把死因争议压缩成一个后世最愿意记住的图像，强调历史记忆如何把复杂事实编织成宿命寓言。\\n‘铁王座拒绝不配统治者’是维斯特洛世界里的政治神话和观众解读，不是已经证实的超自然审判；它的表现力在于让统治工具反过来刺穿统治者。\\n梅葛以篡位、恐怖和弑亲换来的孤立，可作为当前继承战争的历史警告；但黑绿两党与梅葛之间只能做主题类比，不能一一等同。\\n这一幅与下一幅杰赫里斯、亚莉珊并肩而立连续出现，把王朝史组织成‘暴政自毁—秩序修复—后代再度撕裂’的循环。\\n沃米索尔与银\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:prince_jaehaerys_funeral:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"真正的核心不是‘产房悲剧切断继承线’，而是复仇如何从战场外侵入儿童卧室：上一幅的死者是黑党少年，这一幅立即换成绿党幼子，红线因此不再只是抽象血脉，而成为一条双方都能继续拉扯的血债。杰赫里斯既是无辜受害者，也被绿党葬礼重新包装成争取民意的政治符号。挂毯把柔软花环、白布和横断颈部的血线并置，让王室最体面的仪式无法遮住权力斗争对孩子身体的直接伤害。\\n构图先用白布、花叶和蜡烛制造近乎圣像的安静，再用横穿颈部的红线破坏安宁。那条线既像绣线、血痕，也像被暴力截断的血脉，把挂毯媒介本身变成伤口。它不是艾玛产房惨剧的复述，而是第二季新加入的历史补丁：昨天发生的谋杀，今天已经被织成阵营记忆。\\n片头把路斯里斯之死与杰赫里斯之死首尾相接，视觉化戴蒙口中的‘儿子偿还儿子’，也显示报复并没有恢复平衡，只是制造下一轮血债。\\n蜡烛可被读作生命与王朝希望：火焰明灭强化儿童死亡的哀悼感，但不能把每一根蜡烛机械对应到某个具体\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:vhagar_kills_arrax:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这不是普通的龙战回顾，而是继承争议转化为血亲复仇与全面战争的临界点。上一幅仍是两个朝廷、两套法理的对峙；到了这里，政治问题被巨龙的本能和压倒性体型差直接撕碎。更深一层是‘驭龙者未必能驾驭龙’：坦格利安把巨龙当作血统合法性的证明和威慑工具，可真正开战时，这些拥有意志的古老武器会把人的恐吓升级成无法撤回的死亡。\\n圆形构图像一个无法逃出的猎场，瓦格哈尔的深色身体几乎覆盖上方空间，阿拉克斯则被压缩成边缘的小块浅色。挂毯把剧中关于失控、误判和恐惧的复杂过程压缩成‘大龙吞小龙’的历史图标，正好体现后世记忆如何牺牲动机细节，只留下改变战争走向的结果。\\n瓦格哈尔曾属于建立和守护王朝的前代骑手，如今却杀死同族少年的龙；同一份祖先遗产从王朝资本转化为家族内战的毁灭能力。\\n阿拉克斯的弱小不是抽象的‘幼龙意象’，而是路斯里斯政治处境的视觉化：他带着使者身份离开，却面对一个远超外交尺度的战争机器。\\n这幅画紧跟分裂家\"},{\"id\":\"house-of-the-dragon:rel:19:2\",\"knowledge_type\":\"character_relationship\",\"content\":\"敌对 — 雷妮拉拒绝私奔后克里斯顿在婚宴当众杀人——他与雷妮拉的私人忠诚关系在这一帧彻底反转。 — s661 deep_reading：克里斯顿在前段（雷妮拉拒绝与他私奔）+ s509 戴蒙耳语 + s454 阿莉森特绿衣登场……三重压力下，选择把私人羞愤投射到乔弗里身上。\"},{\"id\":\"house-of-the-dragon:rel:20:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"政治盟友 — 克里斯顿黑化完成后转向海塔尔一侧——他对绿党的忠诚从这摊血开始计算。 — s661 deep_reading：克里斯顿本人也在这一帧黑化完成，后续他对绿党的忠诚都是从这摊血开始计算的。\"},{\"id\":\"house-of-the-dragon:char:hugh_hammer:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"龙种 / 雷妮拉阵营的新晋龙骑士，与乌尔夫一同行动 / S03E01 中与乌尔夫等人讨论命令、封赏和是否等待瓦格哈尔。\"},{\"id\":\"house-of-the-dragon:char:ulf_white:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"龙种 / 雷妮拉阵营的新晋龙骑士，对身份和奖赏有强烈诉求 / S03E01 中反复谈及自己的出身、龙血与巨龙，把龙视为越过贵族秩序的权力凭证。\"},{\"id\":\"house-of-the-dragon:recap:23\",\"knowledge_type\":\"external_knowledge\",\"content\":\"紧张感的营造 — 平行剪辑在继承仪式与韦赛里斯的对话中增强了紧张感，暗示权力的争夺。 — 平行剪辑增强了紧张感。\"}]},{\"id\":\"r033\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":2253,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，雷尼拉·坦格利安在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:19:2\",\"knowledge_type\":\"character_relationship\",\"content\":\"敌对 — 雷妮拉拒绝私奔后克里斯顿在婚宴当众杀人——他与雷妮拉的私人忠诚关系在这一帧彻底反转。 — s661 deep_reading：克里斯顿在前段（雷妮拉拒绝与他私奔）+ s509 戴蒙耳语 + s454 阿莉森特绿衣登场……三重压力下，选择把私人羞愤投射到乔弗里身上。\"},{\"id\":\"house-of-the-dragon:rel:44:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"暧昧 — 戴蒙在婚宴舞池贴近雷妮拉耳边低语——在最公开的场合制造最私密的接触，雷妮拉接受了'戴蒙永远在场'。 — s509 deep_reading：在所有人能看到的地方说所有人都听不到的话……她在那一刻接受了'戴蒙永远在场'。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"龙石岛公主，铁王座继承人，莱诺·瓦列利安之妻 / 通过血泊婚礼与瓦列利安家族绑定；其婚事开局即被血涂改 / 在血泊残局中与莱诺·瓦列利安完成割手交血礼，婚事完成但其象征意义已坍塌。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:2\",\"knowledge_type\":\"character_motivation\",\"content\":\"戴蒙的耳语在公开仪式内部撕开私人裂口；雷妮拉默认接受'戴蒙永远在场'的事实 — s509 deep_reading：真正改变雷妮拉轨迹的不是戴蒙说的内容，而是戴蒙能在这个场合说这种话本身——她在那一刻接受了'戴蒙永远在场'。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"认清自己在父亲眼中已是'要被止损的丑闻'，不再为政治婚姻保留浪漫幻想，准备以清醒交易心态进入婚姻 — s146 deep_reading：她已经知道在父亲眼里自己就是'要被止损的丑闻'，她没有理由再为一段政治婚姻保留浪漫幻想。\"},{\"id\":\"house-of-the-dragon:recap:16\",\"knowledge_type\":\"external_knowledge\",\"content\":\"韦赛里斯的逃避 — 韦赛里斯在选择中表现出逃避态度，显示出他内心的矛盾和无力感。 — 韦赛里斯的内心挣扎。\"},{\"id\":\"house-of-the-dragon:recap:21\",\"knowledge_type\":\"external_knowledge\",\"content\":\"龙的象征与家族命运 — 韦赛里斯通过龙的头骨暗示坦格利安家族的脆弱，预示未来的危机。 — 龙象征家族的脆弱与危机。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"公主 / 国王韦赛里斯的独女，并未被视为继承人 / 韦赛里斯之女，钟爱骑龙，对宫廷礼制感到束缚。\"}]},{\"id\":\"r034\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":75,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house_of_dragon_s03e01:scene:s002:prince_jaehaerys_funeral:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"真正的核心不是‘产房悲剧切断继承线’，而是复仇如何从战场外侵入儿童卧室：上一幅的死者是黑党少年，这一幅立即换成绿党幼子，红线因此不再只是抽象血脉，而成为一条双方都能继续拉扯的血债。杰赫里斯既是无辜受害者，也被绿党葬礼重新包装成争取民意的政治符号。挂毯把柔软花环、白布和横断颈部的血线并置，让王室最体面的仪式无法遮住权力斗争对孩子身体的直接伤害。\\n构图先用白布、花叶和蜡烛制造近乎圣像的安静，再用横穿颈部的红线破坏安宁。那条线既像绣线、血痕，也像被暴力截断的血脉，把挂毯媒介本身变成伤口。它不是艾玛产房惨剧的复述，而是第二季新加入的历史补丁：昨天发生的谋杀，今天已经被织成阵营记忆。\\n片头把路斯里斯之死与杰赫里斯之死首尾相接，视觉化戴蒙口中的‘儿子偿还儿子’，也显示报复并没有恢复平衡，只是制造下一轮血债。\\n蜡烛可被读作生命与王朝希望：火焰明灭强化儿童死亡的哀悼感，但不能把每一根蜡烛机械对应到某个具体\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:maegor_dead_on_iron_throne:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"画面的核心不是泛泛的‘王权伴随流血’，而是权力反噬暴君：梅葛靠篡位、恐怖与弑亲维持的统治，最终让象征统治权的铁王座变成了他的刑具。两侧的沃米索尔与银翼则把死亡画面变成一次政权交接——孤立的暴君退场，杰赫里斯与亚莉珊代表的修复性统治即将开始。\\n中央尸体、两侧巨龙和向下渗开的红线把死亡做成王朝转场：梅葛的身体既是暴政终点，也是下一段历史的接缝。挂毯把死因争议压缩成一个后世最愿意记住的图像，强调历史记忆如何把复杂事实编织成宿命寓言。\\n‘铁王座拒绝不配统治者’是维斯特洛世界里的政治神话和观众解读，不是已经证实的超自然审判；它的表现力在于让统治工具反过来刺穿统治者。\\n梅葛以篡位、恐怖和弑亲换来的孤立，可作为当前继承战争的历史警告；但黑绿两党与梅葛之间只能做主题类比，不能一一等同。\\n这一幅与下一幅杰赫里斯、亚莉珊并肩而立连续出现，把王朝史组织成‘暴政自毁—秩序修复—后代再度撕裂’的循环。\\n沃米索尔与银\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:jaehaerys_and_alysanne_restoration:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"构图故意让两人并肩，而不是让王后退到背景：它把新统治的合法性表现为合作、调停与王朝延续。更关键的是与上一幅的剪辑关系——梅葛独自被王座刺穿，杰赫里斯与亚莉珊则成对出现；一个靠恐惧把所有人推远，一个靠联盟与共同治理恢复秩序。杰赫里斯时期对教会的和解、‘例外论’及长期制度建设，说明坦格利安王权不只靠龙与宝剑，也靠把异端血统重新包装成可被王国接受的秩序。\\n梅葛的孤死与这对夫妇的并肩由连续剪辑直接相接：上一幅把权力拍成吞噬人的刑具，这一幅则把权力拍成需要共同维系的制度。以精美、近乎神圣的黄金挂毯承载这段盛世，也让观众意识到正片人物终有一天会像他们一样，被后世压缩成几种姿态和几根丝线。\\n杰赫里斯与亚莉珊的长期统治常被视为王朝黄金时代；片头用这份修复与当前家族撕裂形成反差，以祖先艰难建立的和平反衬后代争夺王座的代价。\\n他们的治世并没有消除继承制度中的性别与合法性矛盾，长期和平之下仍留下后来争端会重新触\"},{\"id\":\"house-of-the-dragon:rel:19:2\",\"knowledge_type\":\"character_relationship\",\"content\":\"敌对 — 雷妮拉拒绝私奔后克里斯顿在婚宴当众杀人——他与雷妮拉的私人忠诚关系在这一帧彻底反转。 — s661 deep_reading：克里斯顿在前段（雷妮拉拒绝与他私奔）+ s509 戴蒙耳语 + s454 阿莉森特绿衣登场……三重压力下，选择把私人羞愤投射到乔弗里身上。\"},{\"id\":\"house-of-the-dragon:rel:8:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"表亲冷淡 — 蕾妮丝在潮头岛迎接仪式上对韦赛里斯施以'不全礼'——海蛇家族用礼节表达不满，蕾妮丝的注视则是冷审视。 — s123 deep_reading：婚事谈得再漂亮，这家人不会真的承认你这一支的优越性。\"},{\"id\":\"house-of-the-dragon:recap:12\",\"knowledge_type\":\"external_knowledge\",\"content\":\"交叉剪辑的暴力与生命 — 通过比武与剖腹的交叉剪辑，展现了暴力与新生命之间的矛盾，暗示了权力斗争的残酷性。 — 暴力与生命的交织暗示权力斗争。\"},{\"id\":\"house-of-the-dragon:recap:23\",\"knowledge_type\":\"external_knowledge\",\"content\":\"紧张感的营造 — 平行剪辑在继承仪式与韦赛里斯的对话中增强了紧张感，暗示权力的争夺。 — 平行剪辑增强了紧张感。\"},{\"id\":\"house-of-the-dragon:char:rhea_royce:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"已故符文谷夫人 / S01E05 冷开场被戴蒙以伪装坠马的方式杀害；蒙太奇拍法让暴行被遮蔽但已成既成事实。\"}]},{\"id\":\"r035\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":249,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，奥托·海塔尔在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:4:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父女 — 阿莉森特是奥托·海塔尔的女儿。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"把海塔尔家族重新推回权力轴线；替被革职的父亲奥托做政治反弹 — s454 deep_reading：女儿用一袭绿衣替父亲把宣战书递回到国王面前。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"海塔尔家族战旗持有者（仍为王后） / 公开宣告归入海塔尔家族一侧；'绿党'诞生时刻的当事人 / 在雷妮拉婚宴上身穿海塔尔祖母绿独自迟到入场——告别韦赛里斯—雷妮拉父女轴线。\"},{\"id\":\"house-of-the-dragon:rel:20:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"政治盟友 — 克里斯顿黑化完成后转向海塔尔一侧——他对绿党的忠诚从这摊血开始计算。 — s661 deep_reading：克里斯顿本人也在这一帧黑化完成，后续他对绿党的忠诚都是从这摊血开始计算的。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"宫廷侍女 / 王之手之女 / 海塔尔家族在朝中的延伸；与雷尼拉自幼相识 / 御前首相奥托之女，与雷尼拉公主同龄、关系亲密。\"},{\"id\":\"house-of-the-dragon:recap:17\",\"knowledge_type\":\"external_knowledge\",\"content\":\"奥托的操控 — 奥托通过安排艾莉森安慰韦赛里斯，展现了他在权力游戏中的操控能力。 — 奥托的权力操控手法。\"},{\"id\":\"house-of-the-dragon:recap:4\",\"knowledge_type\":\"external_knowledge\",\"content\":\"艾玛的角色与情感冲突 — 艾玛的教导与她自身的经历形成对比，暗示她对传统角色的无奈与未来的悲剧。 — 艾玛的教导暗示未来悲剧。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:2\",\"knowledge_type\":\"character_motivation\",\"content\":\"戴蒙的耳语在公开仪式内部撕开私人裂口；雷妮拉默认接受'戴蒙永远在场'的事实 — s509 deep_reading：真正改变雷妮拉轨迹的不是戴蒙说的内容，而是戴蒙能在这个场合说这种话本身——她在那一刻接受了'戴蒙永远在场'。\"}]},{\"id\":\"r036\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":3,\"knowledge_type\":\"scene_reading\",\"query\":\"这一幕里，奥托·海塔尔在做什么、想表达什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:4:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父女 — 阿莉森特是奥托·海塔尔的女儿。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"把海塔尔家族重新推回权力轴线；替被革职的父亲奥托做政治反弹 — s454 deep_reading：女儿用一袭绿衣替父亲把宣战书递回到国王面前。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"海塔尔家族战旗持有者（仍为王后） / 公开宣告归入海塔尔家族一侧；'绿党'诞生时刻的当事人 / 在雷妮拉婚宴上身穿海塔尔祖母绿独自迟到入场——告别韦赛里斯—雷妮拉父女轴线。\"},{\"id\":\"house-of-the-dragon:rel:20:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"政治盟友 — 克里斯顿黑化完成后转向海塔尔一侧——他对绿党的忠诚从这摊血开始计算。 — s661 deep_reading：克里斯顿本人也在这一帧黑化完成，后续他对绿党的忠诚都是从这摊血开始计算的。\" :recap:3\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机与母亲的教导 — 雷尼拉渴望成为龙骑士，与母亲的传统角色期待形成对比，反映出她的叛逆与追求。 — 雷尼拉渴望打破传统角色。\"},{\"id\":\"house-of-the-dragon:char:criston_cole:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"对雷妮拉的私人忠诚转向私愤投射；为后续投靠绿党铺设动机 — s661 deep_reading：克里斯顿对绿党的忠诚都是从这摊血开始计算的。\"}]},{\"id\":\"r038\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":1130,\"knowledge_type\":\"character_motivation\",\"query\":\"雷尼拉·坦格利安这么做的动机是什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"龙石岛公主，铁王座继承人，莱诺·瓦列利安之妻 / 通过血泊婚礼与瓦列利安家族绑定；其婚事开局即被血涂改 / 在血泊残局中与莱诺·瓦列利安完成割手交血礼，婚事完成但其象征意义已坍塌。\"},{\"id\":\"house-of-the-dragon:rel:1:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"叔侄 — 戴蒙是雷尼拉的叔叔。两人之间存在超越正常血亲的张力。\"},{\"id\":\"house-of-the-dragon:recap:2\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机 — 雷尼拉虽然是王位继承人，但对政权并不感兴趣，显示出她的个性与追求。 — 雷尼拉追求自由而非权力。\"},{\"id\":\"house-of-the-dragon:rel:0:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父女 — 韦赛里斯是雷尼拉的父亲。\"},{\"id\":\"house-of-the-dragon:recap:6\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的内心矛盾 — 雷尼拉希望母亲生下男孩，以便她能获得更多自由，这反映了她对权力中心的渴望与无奈。 — 雷尼拉渴望自由与权力的矛盾。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"认清自己在父亲眼中已是'要被止损的丑闻'，不再为政治婚姻保留浪漫幻想，准备以清醒交易心态进入婚姻 — s146 deep_reading：她已经知道在父亲眼里自己就是'要被止损的丑闻'，她没有理由再为一段政治婚姻保留浪漫幻想。\"},{\"id\":\"house-of-the-dragon:char:laenor_velaryon:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"雷妮拉·坦格利安之夫，潮头岛继承人 / 在情人乔弗里被杀的同夜与雷妮拉完成婚礼。\"},{\"id\":\"house-of-the-dragon:char:criston_cole:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"对雷妮拉的私人忠诚转向私愤投射；为后续投靠绿党铺设动机 — s661 deep_reading：克里斯顿对绿党的忠诚都是从这摊血开始计算的。\"}]},{\"id\":\"r039\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":2538,\"knowledge_type\":\"character_motivation\",\"query\":\"科利斯·瓦列利安这么做的动机是什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:10:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"政治盟友 — 通过子嗣联姻把瓦列利安家族绑在雷尼拉一方。\"},{\"id\":\"house-of-the-dragon:char:corlys_velaryon:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"潮汐之主，黑党海军统帅 / 以瓦列利安舰队支撑雷妮拉阵营，喉道海战核心人物 / S03E01 中指挥舰队进入喉道并遭遇伏击。\"},{\"id\":\"house-of-the-dragon:char:corlys_velaryon:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"潮汐之主 / 维斯特洛最富有的航海家族族长；自封「海蛇」 / 瓦列利安家族族长，绰号海蛇，财富与航海经验无人能及。\"},{\"id\":\"house-of-the-dragon:rel:55:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"舰队上下级 — 亚林与科利斯共处瓦列利安舰队线，关系里带有未明说的家族张力。\"},{\"id\":\"house-of-the-dragon:recap:2\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机 — 雷尼拉虽然是王位继承人，但对政权并不感兴趣，显示出她的个性与追求。 — 雷尼拉追求自由而非权力。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:daenys_dream_and_doom_of_valyria:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这是坦格利安王朝真正的‘基因原点’：家族并非从征服开始，而是从一次对毁灭的预见和逃亡开始。第一场梦让他们从火海中幸存，也让‘梦’从此成为家族理解自身使命的语言。片头把预言者、巨龙与流血并置，强调坦格利安最珍贵的天赋始终带着双刃性——他们能比别人更早看见灾难，却未必能正确解释梦，更未必能控制梦被权力使用后的后果。\\n这幅画不按现实空间摆放人物，而像把梦的碎片同时缝在一块布上：惊惧的人、带血的火焰与巨龙彼此侵入。红线在这里既像预言书写下的警告，也像尚未发生却已渗进画面的灾难。片头由此把坦格利安历史的第一步定义为‘提前看见火’，并为后面所有关于梦、继承和龙火失控的故事定下宿命基调。\\n黛妮丝的梦救下家族，后来坦格利安统治者也不断把梦与预言当作政治责任的一部分；两者构成‘预言既能救国，也能成为沉重负担’的历史反差。\\n不能把韦赛里斯迎娶阿莉森直接归因于预言；更准确的关联是，他把王朝使命与征服者之梦交给继\"},{\"id\":\"house-of-the-dragon:recap:3\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机与母亲的教导 — 雷尼拉渴望成为龙骑士，与母亲的传统角色期待形成对比，反映出她的叛逆与追求。 — 雷尼拉渴望打破传统角色。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:vhagar_kills_arrax:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这不是普通的龙战回顾，而是继承争议转化为血亲复仇与全面战争的临界点。上一幅仍是两个朝廷、两套法理的对峙；到了这里，政治问题被巨龙的本能和压倒性体型差直接撕碎。更深一层是‘驭龙者未必能驾驭龙’：坦格利安把巨龙当作血统合法性的证明和威慑工具，可真正开战时，这些拥有意志的古老武器会把人的恐吓升级成无法撤回的死亡。\\n圆形构图像一个无法逃出的猎场，瓦格哈尔的深色身体几乎覆盖上方空间，阿拉克斯则被压缩成边缘的小块浅色。挂毯把剧中关于失控、误判和恐惧的复杂过程压缩成‘大龙吞小龙’的历史图标，正好体现后世记忆如何牺牲动机细节，只留下改变战争走向的结果。\\n瓦格哈尔曾属于建立和守护王朝的前代骑手，如今却杀死同族少年的龙；同一份祖先遗产从王朝资本转化为家族内战的毁灭能力。\\n阿拉克斯的弱小不是抽象的‘幼龙意象’，而是路斯里斯政治处境的视觉化：他带着使者身份离开，却面对一个远超外交尺度的战争机器。\\n这幅画紧跟分裂家\"}]},{\"id\":\"r040\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":1802,\"knowledge_type\":\"character_motivation\",\"query\":\"奥托·海塔尔这么做的动机是什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:4:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父女 — 阿莉森特是奥托·海塔尔的女儿。\"},{\"id\":\"house-of-the-dragon:char:otto_hightower:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"御前首相 / 国王最重要的政务顾问；同时通过其女向王座施加家族影响 / 韦赛里斯朝的御前首相，主张以制度而非武力对抗戴蒙的威胁。\"},{\"id\":\"house-of-the-dragon:char:otto_hightower:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"前任御前首相 / 被韦赛里斯解职的前任'手'，海塔尔家族在朝堂失去最高代言人 / 因如实禀报雷妮拉与戴蒙夜游烟柳事被韦赛里斯反革职，无宣告无饯行式离任。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"把海塔尔家族重新推回权力轴线；替被革职的父亲奥托做政治反弹 — s454 deep_reading：女儿用一袭绿衣替父亲把宣战书递回到国王面前。\"},{\"id\":\"house-of-the-dragon:rel:43:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"公开对立 — 绿衣登场是阿莉森特把对雷妮拉父女轴线的告别公开化的瞬间——闺蜜→疏离→当众宣战。 — s454 deep_reading：色码、迟到、独行，三个仪式层面的动作叠加……'绿党'诞生的视觉签字时刻。\"},{\"id\":\"house-of-the-dragon:recap:17\",\"knowledge_type\":\"external_knowledge\",\"content\":\"奥托的操控 — 奥托通过安排艾莉森安慰韦赛里斯，展现了他在权力游戏中的操控能力。 — 奥托的权力操控手法。\"},{\"id\":\"house-of-the-dragon:recap:3\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机与母亲的教导 — 雷尼拉渴望成为龙骑士，与母亲的传统角色期待形成对比，反映出她的叛逆与追求。 — 雷尼拉渴望打破传统角色。\"},{\"id\":\"house-of-the-dragon:char:criston_cole:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"对雷妮拉的私人忠诚转向私愤投射；为后续投靠绿党铺设动机 — s661 deep_reading：克里斯顿对绿党的忠诚都是从这摊血开始计算的。\"}]},{\"id\":\"r041\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":837,\"knowledge_type\":\"character_motivation\",\"query\":\"戴蒙·坦格利安这么做的动机是什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:recap:18\",\"knowledge_type\":\"external_knowledge\",\"content\":\"韦赛里斯的软弱与戴蒙的直言 — 戴蒙直言揭露韦赛里斯的软弱，反映出权力斗争中的真实动机与内心挣扎。 — 权力斗争中的真实动机。\"},{\"id\":\"house-of-the-dragon:rel:6:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"政治对立 — 戴蒙视奥托为弱化王权的宫廷文官代表；奥托则视戴蒙为最大威胁。\"},{\"id\":\"house-of-the-dragon:char:daemon_targaryen:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"亲王，雷妮拉的王夫 / 黑党军事支柱，在河间地战线推进战事 / S03E01 中继续河间地战事，并以武力确认敌军动向。\"},{\"id\":\"house-of-the-dragon:char:daemon_targaryen:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"都城卫戍司令 / 王子 / 国王之弟，性情野且具威胁性，被部分朝臣视为危险因素 / 韦赛里斯的弟弟，被一度认为可能继承王位，但行事张扬好战。\"},{\"id\":\"house-of-the-dragon:rel:12:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"表亲 — 同代坦格利安，对宫廷政治都看得透。\"},{\"id\":\"house-of-the-dragon:recap:5\",\"knowledge_type\":\"external_knowledge\",\"content\":\"戴蒙的权力渴望与性格分析 — 戴蒙坐在铁王座上，暗示他对权力的渴望，但国王韦赛里斯认为他会成为暴君，因此不可能选他为继承人。 — 戴蒙的性格影响继承权选择。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:2\",\"knowledge_type\":\"character_motivation\",\"content\":\"戴蒙的耳语在公开仪式内部撕开私人裂口；雷妮拉默认接受'戴蒙永远在场'的事实 — s509 deep_reading：真正改变雷妮拉轨迹的不是戴蒙说的内容，而是戴蒙能在这个场合说这种话本身——她在那一刻接受了'戴蒙永远在场'。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:daenys_dream_and_doom_of_valyria:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这是坦格利安王朝真正的‘基因原点’：家族并非从征服开始，而是从一次对毁灭的预见和逃亡开始。第一场梦让他们从火海中幸存，也让‘梦’从此成为家族理解自身使命的语言。片头把预言者、巨龙与流血并置，强调坦格利安最珍贵的天赋始终带着双刃性——他们能比别人更早看见灾难，却未必能正确解释梦，更未必能控制梦被权力使用后的后果。\\n这幅画不按现实空间摆放人物，而像把梦的碎片同时缝在一块布上：惊惧的人、带血的火焰与巨龙彼此侵入。红线在这里既像预言书写下的警告，也像尚未发生却已渗进画面的灾难。片头由此把坦格利安历史的第一步定义为‘提前看见火’，并为后面所有关于梦、继承和龙火失控的故事定下宿命基调。\\n黛妮丝的梦救下家族，后来坦格利安统治者也不断把梦与预言当作政治责任的一部分；两者构成‘预言既能救国，也能成为沉重负担’的历史反差。\\n不能把韦赛里斯迎娶阿莉森直接归因于预言；更准确的关联是，他把王朝使命与征服者之梦交给继\"}]},{\"id\":\"r042\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":3035,\"knowledge_type\":\"character_motivation\",\"query\":\"科利斯·瓦列利安这么做的动机是什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:10:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"政治盟友 — 通过子嗣联姻把瓦列利安家族绑在雷尼拉一方。\"},{\"id\":\"house-of-the-dragon:char:corlys_velaryon:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"潮汐之主，黑党海军统帅 / 以瓦列利安舰队支撑雷妮拉阵营，喉道海战核心人物 / S03E01 中指挥舰队进入喉道并遭遇伏击。\"},{\"id\":\"house-of-the-dragon:char:corlys_velaryon:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"潮汐之主 / 维斯特洛最富有的航海家族族长；自封「海蛇」 / 瓦列利安家族族长，绰号海蛇，财富与航海经验无人能及。\"},{\"id\":\"house_of_dragon_s03e01:scene:s059:lohar_follows_sea_snake_into_narrows:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这个人物特写把抽象的追兵变成了洛哈尔的个人选择：她明知正在进入海蛇熟悉、自己陌生的水域，仍因追杀科利斯的执念继续压上。镜头因此不是单纯展示航线，而是在交代她如何主动走进科利斯布置的地形陷阱。\"},{\"id\":\"house-of-the-dragon:rel:55:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"舰队上下级 — 亚林与科利斯共处瓦列利安舰队线，关系里带有未明说的家族张力。\"},{\"id\":\"house-of-the-dragon:recap:2\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机 — 雷尼拉虽然是王位继承人，但对政权并不感兴趣，显示出她的个性与追求。 — 雷尼拉追求自由而非权力。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:daenys_dream_and_doom_of_valyria:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这是坦格利安王朝真正的‘基因原点’：家族并非从征服开始，而是从一次对毁灭的预见和逃亡开始。第一场梦让他们从火海中幸存，也让‘梦’从此成为家族理解自身使命的语言。片头把预言者、巨龙与流血并置，强调坦格利安最珍贵的天赋始终带着双刃性——他们能比别人更早看见灾难，却未必能正确解释梦，更未必能控制梦被权力使用后的后果。\\n这幅画不按现实空间摆放人物，而像把梦的碎片同时缝在一块布上：惊惧的人、带血的火焰与巨龙彼此侵入。红线在这里既像预言书写下的警告，也像尚未发生却已渗进画面的灾难。片头由此把坦格利安历史的第一步定义为‘提前看见火’，并为后面所有关于梦、继承和龙火失控的故事定下宿命基调。\\n黛妮丝的梦救下家族，后来坦格利安统治者也不断把梦与预言当作政治责任的一部分；两者构成‘预言既能救国，也能成为沉重负担’的历史反差。\\n不能把韦赛里斯迎娶阿莉森直接归因于预言；更准确的关联是，他把王朝使命与征服者之梦交给继\"},{\"id\":\"house-of-the-dragon:recap:3\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机与母亲的教导 — 雷尼拉渴望成为龙骑士，与母亲的传统角色期待形成对比，反映出她的叛逆与追求。 — 雷尼拉渴望打破传统角色。\"}]},{\"id\":\"r043\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":1361,\"knowledge_type\":\"character_motivation\",\"query\":\"雷尼拉·坦格利安这么做的动机是什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"龙石岛公主，铁王座继承人，莱诺·瓦列利安之妻 / 通过血泊婚礼与瓦列利安家族绑定；其婚事开局即被血涂改 / 在血泊残局中与莱诺·瓦列利安完成割手交血礼，婚事完成但其象征意义已坍塌。\"},{\"id\":\"house-of-the-dragon:rel:1:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"叔侄 — 戴蒙是雷尼拉的叔叔。两人之间存在超越正常血亲的张力。\"},{\"id\":\"house-of-the-dragon:recap:2\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机 — 雷尼拉虽然是王位继承人，但对政权并不感兴趣，显示出她的个性与追求。 — 雷尼拉追求自由而非权力。\"},{\"id\":\"house-of-the-dragon:rel:0:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父女 — 韦赛里斯是雷尼拉的父亲。\"},{\"id\":\"house-of-the-dragon:recap:6\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的内心矛盾 — 雷尼拉希望母亲生下男孩，以便她能获得更多自由，这反映了她对权力中心的渴望与无奈。 — 雷尼拉渴望自由与权力的矛盾。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"认清自己在父亲眼中已是'要被止损的丑闻'，不再为政治婚姻保留浪漫幻想，准备以清醒交易心态进入婚姻 — s146 deep_reading：她已经知道在父亲眼里自己就是'要被止损的丑闻'，她没有理由再为一段政治婚姻保留浪漫幻想。\"},{\"id\":\"house-of-the-dragon:char:laenor_velaryon:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"雷妮拉·坦格利安之夫，潮头岛继承人 / 在情人乔弗里被杀的同夜与雷妮拉完成婚礼。\"},{\"id\":\"house-of-the-dragon:char:criston_cole:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"对雷妮拉的私人忠诚转向私愤投射；为后续投靠绿党铺设动机 — s661 deep_reading：克里斯顿对绿党的忠诚都是从这摊血开始计算的。\"}]},{\"id\":\"r044\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":1497,\"knowledge_type\":\"character_motivation\",\"query\":\"科利斯·瓦列利安这么做的动机是什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:10:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"政治盟友 — 通过子嗣联姻把瓦列利安家族绑在雷尼拉一方。\"},{\"id\":\"house-of-the-dragon:rel:55:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"舰队上下级 — 亚林与科利斯共处瓦列利安舰队线，关系里带有未明说的家族张力。\"},{\"id\":\"house-of-the-dragon:char:corlys_velaryon:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"潮汐之主，黑党海军统帅 / 以瓦列利安舰队支撑雷妮拉阵营，喉道海战核心人物 / S03E01 中指挥舰队进入喉道并遭遇伏击。\"},{\"id\":\"house-of-the-dragon:char:corlys_velaryon:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"潮汐之主 / 维斯特洛最富有的航海家族族长；自封「海蛇」 / 瓦列利安家族族长，绰号海蛇，财富与航海经验无人能及。\"},{\"id\":\"house-of-the-dragon:recap:2\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机 — 雷尼拉虽然是王位继承人，但对政权并不感兴趣，显示出她的个性与追求。 — 雷尼拉追求自由而非权力。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:daenys_dream_and_doom_of_valyria:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这是坦格利安王朝真正的‘基因原点’：家族并非从征服开始，而是从一次对毁灭的预见和逃亡开始。第一场梦让他们从火海中幸存，也让‘梦’从此成为家族理解自身使命的语言。片头把预言者、巨龙与流血并置，强调坦格利安最珍贵的天赋始终带着双刃性——他们能比别人更早看见灾难，却未必能正确解释梦，更未必能控制梦被权力使用后的后果。\\n这幅画不按现实空间摆放人物，而像把梦的碎片同时缝在一块布上：惊惧的人、带血的火焰与巨龙彼此侵入。红线在这里既像预言书写下的警告，也像尚未发生却已渗进画面的灾难。片头由此把坦格利安历史的第一步定义为‘提前看见火’，并为后面所有关于梦、继承和龙火失控的故事定下宿命基调。\\n黛妮丝的梦救下家族，后来坦格利安统治者也不断把梦与预言当作政治责任的一部分；两者构成‘预言既能救国，也能成为沉重负担’的历史反差。\\n不能把韦赛里斯迎娶阿莉森直接归因于预言；更准确的关联是，他把王朝使命与征服者之梦交给继\"},{\"id\":\"house-of-the-dragon:recap:3\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机与母亲的教导 — 雷尼拉渴望成为龙骑士，与母亲的传统角色期待形成对比，反映出她的叛逆与追求。 — 雷尼拉渴望打破传统角色。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:vhagar_kills_arrax:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这不是普通的龙战回顾，而是继承争议转化为血亲复仇与全面战争的临界点。上一幅仍是两个朝廷、两套法理的对峙；到了这里，政治问题被巨龙的本能和压倒性体型差直接撕碎。更深一层是‘驭龙者未必能驾驭龙’：坦格利安把巨龙当作血统合法性的证明和威慑工具，可真正开战时，这些拥有意志的古老武器会把人的恐吓升级成无法撤回的死亡。\\n圆形构图像一个无法逃出的猎场，瓦格哈尔的深色身体几乎覆盖上方空间，阿拉克斯则被压缩成边缘的小块浅色。挂毯把剧中关于失控、误判和恐惧的复杂过程压缩成‘大龙吞小龙’的历史图标，正好体现后世记忆如何牺牲动机细节，只留下改变战争走向的结果。\\n瓦格哈尔曾属于建立和守护王朝的前代骑手，如今却杀死同族少年的龙；同一份祖先遗产从王朝资本转化为家族内战的毁灭能力。\\n阿拉克斯的弱小不是抽象的‘幼龙意象’，而是路斯里斯政治处境的视觉化：他带着使者身份离开，却面对一个远超外交尺度的战争机器。\\n这幅画紧跟分裂家\"}]},{\"id\":\"r045\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":3733,\"knowledge_type\":\"character_motivation\",\"query\":\"贝妮拉·坦格利安这么做的动机是什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:char:baela_targaryen:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"坦格利安贵女 / 雷妮拉阵营的年轻龙骑士，喉道海战的空中力量 / 戴蒙的女儿，骑乘月舞。在 S03E01 喉道海战中支援科利斯舰队。\"},{\"id\":\"house-of-the-dragon:rel:50:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"盟友 / 继女 — 贝妮拉站在雷妮拉阵营，并以龙骑士身份参战。\"},{\"id\":\"house-of-the-dragon:char:rhaena_targaryen:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"坦格利安贵女 / 雷妮拉阵营的年轻成员，正在建立自己的龙骑士身份 / 戴蒙的女儿。S03E01 中在雾谷尝试驯服偷羊贼，并在后段参与海战。\"},{\"id\":\"house-of-the-dragon:rel:51:0\",\"knowledge_type\":\"character_relati ream_and_doom_of_valyria:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这是坦格利安王朝真正的‘基因原点’：家族并非从征服开始，而是从一次对毁灭的预见和逃亡开始。第一场梦让他们从火海中幸存，也让‘梦’从此成为家族理解自身使命的语言。片头把预言者、巨龙与流血并置，强调坦格利安最珍贵的天赋始终带着双刃性——他们能比别人更早看见灾难，却未必能正确解释梦，更未必能控制梦被权力使用后的后果。\\n这幅画不按现实空间摆放人物，而像把梦的碎片同时缝在一块布上：惊惧的人、带血的火焰与巨龙彼此侵入。红线在这里既像预言书写下的警告，也像尚未发生却已渗进画面的灾难。片头由此把坦格利安历史的第一步定义为‘提前看见火’，并为后面所有关于梦、继承和龙火失控的故事定下宿命基调。\\n黛妮丝的梦救下家族，后来坦格利安统治者也不断把梦与预言当作政治责任的一部分；两者构成‘预言既能救国，也能成为沉重负担’的历史反差。\\n不能把韦赛里斯迎娶阿莉森直接归因于预言；更准确的关联是，他把王朝使命与征服者之梦交给继\"},{\"id\":\"house-of-the-dragon:recap:3\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机与母亲的教导 — 雷尼拉渴望成为龙骑士，与母亲的传统角色期待形成对比，反映出她的叛逆与追求。 — 雷尼拉渴望打破传统角色。\"}]},{\"id\":\"r048\",\"videoId\":\"house_of_dragon_s03e01\",\"cursorTime\":1891,\"knowledge_type\":\"character_motivation\",\"query\":\"拉里斯·斯壮这么做的动机是什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:char:larys_strong:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"拉里斯·斯壮 / 绿党阴影中的筹码管理者，与伊耿形成逃亡依存关系 / S03E01 中与伊耿处于逃亡线，掌握信息与安排，也把伊耿视为未来政治筹码。\"},{\"id\":\"house-of-the-dragon:char:larys_strong:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"斯壮家次子 / 御前首相莱昂诺的次子 / 莱昂诺·斯壮的次子，瘸腿，沉默寡言，善于经营暗中关系。\"},{\"id\":\"house-of-the-dragon:rel:14:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父子 — 拉里斯是河铭城公爵的次子。\"},{\"id\":\"house-of-the-dragon:rel:15:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"兄弟 — \\\"折骨\\\"哈尔温与\\\"瘸子\\\"拉里斯——气质截然相反的两兄弟。\"},{\"id\":\"house-of-the-dragon:char:criston_cole:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"对雷妮拉的私人忠诚转向私愤投射；为后续投靠绿党铺设动机 — s661 deep_reading：克里斯顿对绿党的忠诚都是从这摊血开始计算的。\"},{\"id\":\"house-of-the-dragon:recap:18\",\"knowledge_type\":\"external_knowledge\",\"content\":\"韦赛里斯的软弱与戴蒙的直言 — 戴蒙直言揭露韦赛里斯的软弱，反映出权力斗争中的真实动机与内心挣扎。 — 权力斗争中的真实动机。\"},{\"id\":\"house_of_dragon_s03e01:scene:s002:vhagar_kills_arrax:reading\",\"knowledge_type\":\"scene_reading\",\"content\":\"这不是普通的龙战回顾，而是继承争议转化为血亲复仇与全面战争的临界点。上一幅仍是两个朝廷、两套法理的对峙；到了这里，政治问题被巨龙的本能和压倒性体型差直接撕碎。更深一层是‘驭龙者未必能驾驭龙’：坦格利安把巨龙当作血统合法性的证明和威慑工具，可真正开战时，这些拥有意志的古老武器会把人的恐吓升级成无法撤回的死亡。\\n圆形构图像一个无法逃出的猎场，瓦格哈尔的深色身体几乎覆盖上方空间，阿拉克斯则被压缩成边缘的小块浅色。挂毯把剧中关于失控、误判和恐惧的复杂过程压缩成‘大龙吞小龙’的历史图标，正好体现后世记忆如何牺牲动机细节，只留下改变战争走向的结果。\\n瓦格哈尔曾属于建立和守护王朝的前代骑手，如今却杀死同族少年的龙；同一份祖先遗产从王朝资本转化为家族内战的毁灭能力。\\n阿拉克斯的弱小不是抽象的‘幼龙意象’，而是路斯里斯政治处境的视觉化：他带着使者身份离开，却面对一个远超外交尺度的战争机器。\\n这幅画紧跟分裂家\"},{\"id\":\"house-of-the-dragon:recap:2\",\"knowledge_type\":\"external_knowledge\",\"content\":\"雷尼拉的动机 — 雷尼拉虽然是王位继承人，但对政权并不感兴趣，显示出她的个性与追求。 — 雷尼拉追求自由而非权力。\"}]},{\"id\":\"r049\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":2135,\"knowledge_type\":\"lore_card\",\"query\":\"坦格利安家族的龙是从哪来的？\",\"chunks\":[{\"id\":\"house-of-the-dragon:recap:21\",\"knowledge_type\":\"external_knowledge\",\"content\":\"龙的象征与家族命运 — 韦赛里斯通过龙的头骨暗示坦格利安家族的脆弱，预示未来的危机。 — 龙象征家族的脆弱与危机。\"},{\"id\":\"house-of-the-dragon:rel:0:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父女 — 韦赛里斯是雷尼拉的父亲。\"},{\"id\":\"house-of-the-dragon:rel:36:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"龙骑士 — 原本是科利斯之子劳琳诺的龙，剧中没有直接登场太多——这里以瓦列利安家族关联呈现。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"龙石岛公主，铁王座继承人，莱诺·瓦列利安之妻 / 通过血泊婚礼与瓦列利安家族绑定；其婚事开局即被血涂改 / 在血泊残局中与莱诺·瓦列利安完成割手交血礼，婚事完成但其象征意义已坍塌。\"},{\"id\":\"house-of-the-dragon:char:viserys_targaryen:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"七大王国之王 / 王朝维系者，介于平衡各家族之间 / 坦格利安王朝第五任国王，老国王杰赫里斯指定的继承人，被期待维系王朝百年和平。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"认清自己在父亲眼中已是'要被止损的丑闻'，不再为政治婚姻保留浪漫幻想，准备以清醒交易心态进入婚姻 — s146 deep_reading：她已经知道在父亲眼里自己就是'要被止损的丑闻'，她没有理由再为一段政治婚姻保留浪漫幻想。\"},{\"id\":\"house-of-the-dragon:lore:4\",\"knowledge_type\":\"lore_card\",\"content\":\"瓦雷利亚的龙 — 瓦雷利亚的力量源于驯龙技术，利用龙在战争中取得胜利。 — 龙在瓦雷利亚的历史中扮演了关键角色。\"},{\"id\":\"house-of-the-dragon:lore:0\",\"knowledge_type\":\"lore_card\",\"content\":\"House Targaryen — House Targaryen是维斯特洛的一个流亡大贵族，曾是七国的王室。 — House Targaryen的标志是三头红龙，家族口号是'火与血'。\"}]},{\"id\":\"r050\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":2135,\"knowledge_type\":\"lore_card\",\"query\":\"铁王座象征着什么？\",\"chunks\":[{\"id\":\"house-of-the-dragon:recap:20\",\"knowledge_type\":\"external_knowledge\",\"content\":\"铁王座的象征意义 — 铁王座不仅象征权力，也暗示其危险性，反映出权力争夺的残酷。 — 铁王座象征权力与危险。\"},{\"id\":\"house-of-the-dragon:recap:19\",\"knowledge_type\":\"external_knowledge\",\"content\":\"铁王座的象征意义 — 韦赛里斯被铁王座割伤，暗示权力的代价与不适。 — 权力的代价与痛苦。\"},{\"id\":\"house-of-the-dragon:rel:3:2\",\"knowledge_type\":\"character_relationship\",\"content\":\"夫妻对立 — 在雷妮拉婚宴上身穿海塔尔祖母绿独自迟到——王后用最公开的仪式当众告别国王轴线。 — s454 deep_reading：阿莉森特此前一直依附韦赛里斯—雷妮拉的'国王—继承人'轴线……今晚她决意用最公开的仪式当众告别这个轴线。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:1\",\"knowledge_type\":\"character_state\",\"content\":\"龙石岛公主，铁王座继承人 / 王朝继承人，承受家族期待与传统男权的双重压力 / 被父王册封为铁王座继承人，但其地位受到挑战，并被要求履行政治联姻的责任。\"},{\"id\":\"house-of-the-dragon:rel:41:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"信任破裂 — 韦赛里斯派人送月亮茶到龙石岛——父亲在沉默中宣告不再相信女儿。父女间从此再无'我可以问你'的空间。 — s146 deep_reading：他选择用药代替对话，雷妮拉接过药代替解释，两人都用沉默确认彼此的不信任。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:state:2\",\"knowledge_type\":\"character_state\",\"content\":\"龙石岛公主，铁王座继承人，莱诺·瓦列利安之妻 / 通过血泊婚礼与瓦列利安家族绑定；其婚事开局即被血涂改 / 在血泊残局中与莱诺·瓦列利安完成割手交血礼，婚事完成但其象征意义已坍塌。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:0\",\"knowledge_type\":\"character_motivation\",\"content\":\"认清自己在父亲眼中已是'要被止损的丑闻'，不再为政治婚姻保留浪漫幻想，准备以清醒交易心态进入婚姻 — s146 deep_reading：她已经知道在父亲眼里自己就是'要被止损的丑闻'，她没有理由再为一段政治婚姻保留浪漫幻想。\"},{\"id\":\"house-of-the-dragon:char:rhaenyra_targaryen:motive:2\",\"knowledge_type\":\"character_motivation\",\"content\":\"戴蒙的耳语在公开仪式内部撕开私人裂口；雷妮拉默认接受'戴蒙永远在场'的事实 — s509 deep_reading：真正改变雷妮拉轨迹的不是戴蒙说的内容，而是戴蒙能在这个场合说这种话本身——她在那一刻接受了'戴蒙永远在场'。\"}]},{\"id\":\"r051\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":2135,\"knowledge_type\":\"lore_card\",\"query\":\"瓦雷利亚是个什么样的地方？\",\"chunks\":[{\"id\":\"house-of-the-dragon:lore:3\",\"knowledge_type\":\"lore_card\",\"content\":\"古瓦雷利亚 — 古瓦雷利亚是曾经伟大文明瓦雷利亚自由邦的首都，位于埃索斯东部的瓦雷利亚半岛上。 — 古瓦雷利亚是一个重要的历史地点，影响了后来的许多事件。\"},{\"id\":\"house-of-the-dragon:rel:0:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"父女 — 韦赛里斯是雷尼拉的父亲。\"},{\"id\":\"house-of-the-dragon:rel:3:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"夫妻 — 阿莉森特成为韦赛里斯的第二任王后。\"},{\"id\":\"house-of-the-dragon:lore:5\",\"knowledge_type\":\"lore_card\",\"content\":\"瓦雷利亚的习俗 — 瓦雷利亚有一些在世界其他地方被禁止的习俗，如近亲结婚和一夫多妻制。 — 瓦雷利亚的习俗与其他文化有显著不同。\"},{\"id\":\"house-of-the-dragon:recap:21\",\"knowledge_type\":\"external_knowledge\",\"content\":\"龙的象征与家族命运 — 韦赛里斯通过龙的头骨暗示坦格利安家族的脆弱，预示未来的危机。 — 龙象征家族的脆弱与危机。\"},{\"id\":\"house-of-the-dragon:char:alicent_hightower:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"宫廷侍女 / 王之手之女 / 海塔尔家族在朝中的延伸；与雷尼拉自幼相识 / 御前首相奥托之女，与雷尼拉公主同龄、关系亲密。\"},{\"id\":\"house-of-the-dragon:recap:18\",\"knowledge_type\":\"external_knowledge\",\"content\":\"韦赛里斯的软弱与戴蒙的直言 — 戴蒙直言揭露韦赛里斯的软弱，反映出权力斗争中的真实动机与内心挣扎。 — 权力斗争中的真实动机。\"},{\"id\":\"house-of-the-dragon:char:viserys_targaryen:state:0\",\"knowledge_type\":\"character_state\",\"content\":\"七大王国之王 / 王朝维系者，介于平衡各家族之间 / 坦格利安王朝第五任国王，老国王杰赫里斯指定的继承人，被期待维系王朝百年和平。\"}]},{\"id\":\"r052\",\"videoId\":\"house_of_dragon_05\",\"cursorTime\":2135,\"knowledge_type\":\"lore_card\",\"query\":\"绿党和黑党的分裂是怎么来的？\",\"chunks\":[{\"id\":\"house-of-the-dragon:rel:40:0\",\"knowledge_type\":\"character_relationship\",\"content\":\"决裂 — 韦赛里斯因奥托报告雷妮拉与戴蒙夜游烟柳之事反将奥托革职——多年同僚以无宣告无饯行的形式一夜决裂。 — s109 deep_reading：韦赛里斯因奥托如实禀报……反将奥托革职……'国王之手'被悄无声息地从权力中心抹掉。\"},{\"id\":\"house-of-the-dragon:recap:12\",\"knowledge_type\":\"external_knowledge\",\"content\":\"交叉剪辑的暴力与生命 — 通过比武与剖腹的交叉剪辑，展现了暴力与新生命之间的矛盾，暗示了权力斗争的残酷性。 — 暴力与生命的交织暗示权力斗争。\"},{\"id\":\"house-of-the-dragon:rel:20:1\",\"knowledge_type\":\"character_relationship\",\"content\":\"政治盟友 — 克里斯顿黑化完成后转向海塔尔一侧——他对绿党的忠诚从这摊血开始计算。 — s661 deep_reading：克里斯顿本人也在这一帧黑化完成，后续他对绿党的忠诚都是从这摊血开始计算的。\"},{\"id\":\"house-of-the-dragon:char:cri     state.ret[item.id] = state.ret[item.id] || { labels:{}, done:false };
    const st = state.ret[item.id];
    const box = el('div','item'); box.dataset.id=item.id;
    const q = el('div','q', item.query); box.appendChild(q);
    const meta = el('div','meta');
    meta.appendChild(el('span','tag', item.knowledge_type));
    meta.appendChild(document.createTextNode(item.videoId+' · t='+item.cursorTime+'s · 召回 '+item.chunks.length+' 块'));
    box.appendChild(meta);
    if(!item.chunks.length){ box.appendChild(el('div','lead','（没有召回任何块）')); }
    item.chunks.forEach(ch=>{
      const row = el('div','chunk');
      const body = el('div','body');
      body.appendChild(el('span','ktype', ch.knowledge_type+'  ·  '+ch.id));
      body.appendChild(document.createTextNode(ch.content));
      row.appendChild(body);
      const pills = el('div','pills');
      [['core','核心',2],['rel','相关',1],['irr','无关',0]].forEach(([c,label,val])=>{
        const p = el('button','pill '+c, label);
        p.dataset.on = (st.labels[ch.id]===val)?'1':'0';
        p.onclick=()=>{ st.labels[ch.id]=val; refreshRow(pills, ch.id, st); markMaybeDone(item, st, box); save(); };
        pills.appendChild(p);
      });
      row.appendChild(pills);
      box.appendChild(row);
    });
    const rest = el('button','rowbtn','其余全部无关，标记完成');
    rest.onclick=()=>{ item.chunks.forEach(ch=>{ if(st.labels[ch.id]==null) st.labels[ch.id]=0; }); st.done=true; renderRetItem(box,item,st); save(); toast('已完成本题'); };
    box.appendChild(rest);
    if(st.done) box.classList.add('done');
    retList.appendChild(box);
  });
  function refreshRow(pills, chId, st){ [...pills.children].forEach((p,i)=>{ const v=[2,1,0][i]; p.dataset.on=(st.labels[chId]===v)?'1':'0'; }); }
  function markMaybeDone(item, st, box){ const all=item.chunks.every(ch=>st.labels[ch.id]!=null); if(all){ st.done=true; box.classList.add('done'); } }
  function renderRetItem(box,item,st){ const pillsList=box.querySelectorAll('.pills'); item.chunks.forEach((ch,i)=>refreshRow(pillsList[i],ch.id,st)); box.classList.toggle('done',!!st.done); }

  // ---- answers ----
  const ansList = document.getElementById('ans-list');
  DATA.answers.forEach(item=>{
    state.ans[item.id] = state.ans[item.id] || { factuality:null, helpfulness:null, note:'' };
    const st = state.ans[item.id];
    const box = el('div','item'); box.dataset.id=item.id;
    box.appendChild(el('div','q', item.question));
    const meta = el('div','meta');
    meta.appendChild(el('span','tag', item.prompt_kind));
    meta.appendChild(document.createTextNode(item.videoId+' · t='+item.t+'s · scene '+(item.reference.scene_id||'—')));
    box.appendChild(meta);
    box.appendChild(el('div','answer', item.answer||'（空回答）'));

    // reference
    const det = el('details'); det.appendChild(el('summary','','参考资料（当前场景 + 检索到的知识，辅助判断）'));
    const ref = el('div','ref');
    if(item.reference.plot_fact){ const b=el('div'); b.appendChild(el('b',null,'画面事实：')); b.appendChild(document.createTextNode(item.reference.plot_fact)); ref.appendChild(b); }
    if(item.reference.plot_reading){ const b=el('div','rk'); b.appendChild(el('b',null,'解读：')); b.appendChild(document.createTextNode(item.reference.plot_reading)); ref.appendChild(b); }
    (item.reference.retrieved||[]).forEach(r=>{ const b=el('div','rk'); b.appendChild(el('b',null,r.knowledge_type+'：')); b.appendChild(document.createTextNode(r.content)); ref.appendChild(b); });
    det.appendChild(ref); box.appendChild(det);

    box.appendChild(axis('事实性', [['f-ok','完全正确','ok'],['f-minor','有小错','minor'],['f-bad','有编造/错误','bad'],['f-na','无法判断','na']], st, 'factuality', item, box));
    box.appendChild(axis('有用性', [['h-hi','很有用','hi'],['h-mid','一般','mid'],['h-no','没用','no']], st, 'helpfulness', item, box));

    const note = el('textarea','note'); note.placeholder='备注（可选）：错在哪 / 漏了什么'; note.value=st.note||'';
    note.oninput=()=>{ st.note=note.value; save(); };
    box.appendChild(note);
    if(st.factuality) box.classList.add('done');
    ansList.appendChild(box);
  });
  function axis(label, opts, st, field, item, box){
    const wrap = el('div','axis'); wrap.appendChild(el('div','axis-lab', label));
    const pills = el('div','pills');
    opts.forEach(([cls,text,val])=>{
      const p = el('button','pill '+cls, text);
      p.dataset.on=(st[field]===val)?'1':'0';
      p.onclick=()=>{ st[field]=val; [...pills.children].forEach((x,i)=>x.dataset.on=(st[field]===opts[i][2])?'1':'0'); box.classList.toggle('done',!!st.factuality); save(); };
      pills.appendChild(p);
    });
    wrap.appendChild(pills); return wrap;
  }

  // ---- progress / tabs / export ----
  function updateProgress(){
    const rTot=DATA.retrieval.length, aTot=DATA.answers.length;
    const rDone=DATA.retrieval.filter(i=>state.ret[i.id]&&state.ret[i.id].done).length;
    const aDone=DATA.answers.filter(i=>state.ans[i.id]&&state.ans[i.id].factuality).length;
    const done=rDone+aDone, tot=rTot+aTot;
    document.getElementById('pfill').style.width=(tot?done/tot*100:0)+'%';
    document.getElementById('pnum').textContent=done+' / '+tot+' 已标';
    document.getElementById('ret-count').textContent='('+rDone+'/'+rTot+')';
    document.getElementById('ans-count').textContent='('+aDone+'/'+aTot+')';
  }
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
    document.getElementById('sec-ret').classList.toggle('hide', t.dataset.tab!=='ret');
    document.getElementById('sec-ans').classList.toggle('hide', t.dataset.tab!=='ans');
    window.scrollTo(0,0);
  });
  document.getElementById('export').onclick=()=>{
    const out={ tool:'hotd-eval-annotation', version:1, exportedAt:new Date().toISOString(), builtAt:DATA.generatedAt,
      retrieval:DATA.retrieval.map(i=>({id:i.id, videoId:i.videoId, cursorTime:i.cursorTime, knowledge_type:i.knowledge_type, query:i.query,
        labels:(state.ret[i.id]||{}).labels||{}, done:!!(state.ret[i.id]||{}).done})),
      answers:DATA.answers.map(i=>({id:i.id, videoId:i.videoId, t:i.t, prompt_kind:i.prompt_kind, question:i.question,
        factuality:(state.ans[i.id]||{}).factuality||null, helpfulness:(state.ans[i.id]||{}).helpfulness||null, note:(state.ans[i.id]||{}).note||''})) };
    const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='eval-annotations.json'; a.click();
    toast('已导出 eval-annotations.json —— 发给我或放进仓库');
  };
  document.getElementById('reset').onclick=()=>{ if(confirm('清空本机所有标注？不可撤销。')){ localStorage.removeItem(KEY); location.reload(); } };
  let tt; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }
  updateProgress();
})();
</script>
</body></html>
